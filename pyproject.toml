[project]
name = "wifi-har"
version = "1.0.0"
description = "WiFi-based Human Activity Recognition OpenEnv Environment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "openenv-core>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "openai>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wifi_har", "server"]
