name: wifi-har
version: "1.0.0"
description: >
  WiFi-based Human Activity Recognition (WiFi-HAR) is a passive indoor sensing
  environment where an AI agent classifies human activities from structured
  descriptions of WiFi Channel State Information (CSI) features. Simulates
  real-world use cases including eldercare fall detection, smart home automation,
  and occupancy monitoring — without cameras or wearable sensors.

tags:
  - openenv
  - wifi-sensing
  - activity-recognition
  - fall-detection
  - time-series
  - healthcare
  - smart-home

author: Raghav Syal
license: MIT

tasks:
  - name: single_classify
    description: >
      Classify a single clean CSI segment into the correct activity label.
      Low noise, unambiguous signal. Tests basic domain understanding.
    difficulty: easy
    max_steps: 1
    reward_range: [0.0, 1.0]

  - name: sequence_classify
    description: >
      Classify 10 consecutive CSI windows with realistic noise.
      One activity transition occurs mid-sequence. Tests temporal consistency.
    difficulty: medium
    max_steps: 10
    reward_range: [0.0, 1.0]

  - name: fall_detection
    description: >
      Monitor a 30-step stream under high noise. A fall event is injected
      between steps 15-25, preceded by normal walking. Agent must detect
      the fall early while minimizing false alarms. Tests anticipatory reasoning.
    difficulty: hard
    max_steps: 30
    reward_range: [0.0, 1.0]

observation_space:
  type: text
  description: >
    Structured natural-language description of processed CSI features including
    movement intensity, Doppler shift profile, signal variance, pattern duration,
    and noise level estimate. Designed to be interpretable by LLM agents.

action_space:
  type: discrete
  labels: [static, walking, transition, fall]
  description: >
    Agent outputs one of four activity labels as a string.

reward:
  shaped: true
  description: >
    Per-step shaped reward: +1.0 correct, +0.3 partial (related category),
    -0.5 wrong, -1.0 invalid/no action. Final episode score in [0.0, 1.0].

environment:
  type: openenv
  interface: step/reset/state
  entry_point: server.app:app
  dockerfile: Dockerfile
  port: 7860
